<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DjangoBlog{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f5f6f8;
  margin: 0;
}

.hero {
  text-align: center;
  padding: 50px 20px 30px;
}

.hero h1 {
  font-size: 32px;
  color: #1a1a1a;
}

/* Category bar */
.category-bar {
  text-align: center;
  padding: 0 20px 10px;
}

.category-label {
  display: inline-block;
  background: #212529;
  color: #fff;
  font-size: 13px;
  padding: 6px 16px;
  border-radius: 6px;
  margin-bottom: 14px;
}

.category-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 1000px;
  margin: 0 auto;
}

.pill {
  font-size: 13px;
  padding: 4px 12px;
  border: 1px solid #2563eb;
  border-radius: 6px;
  color: #2563eb;
  background: #fff;
  text-decoration: none;
}

.pill:hover {
  background: #dbeafe;
  color: #1d4ed8;
}

.pill.active {
  background: #2563eb;
  color: #fff;
}

/* Post cards */
.post-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  padding: 20px 40px 60px;
  max-width: 1200px;
  margin: 0 auto;
}

.post-card {
  background: #fff;
  border-radius: 10px;
  padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  display: flex;
  flex-direction: column;
}

.post-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}

.post-card h3 {
  margin-top: 0;
  font-size: 18px;
  color: #1a1a1a;
}

.post-meta {
  margin-bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.excerpt {
  color: #555;
  font-size: 14px;
  line-height: 1.5;
}

/* Cover images */
.post-cover {
  width: calc(100% + 48px);
  height: 200px;
  object-fit: cover;
  margin: -24px -24px 16px;
  border-radius: 10px 10px 0 0;
  background: #eef0f3;
}

.post-hero-img {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 16px;
}

/* Buttons */
.btn {
  display: inline-block;
  background: #2563eb;
  color: white;
  padding: 8px 18px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 14px;
  margin-top: 10px;
}

.btn:hover {
  background: #1d4ed8;
  color: white;
}

.post-card .btn {
  margin-top: auto;
  align-self: flex-start;
}

.btn-dark {
  background: #212529;
}

.btn-dark:hover {
  background: #000;
}

.btn-outline-primary {
  background: transparent;
  color: #2563eb;
  border: 1px solid #2563eb;
}

.btn-outline-primary:hover {
  background: #2563eb;
  color: white;
}

.btn-link {
  background: transparent;
  color: #2563eb;
}

.btn-link:hover {
  background: transparent;
  color: #1d4ed8;
}

/* Extra button colours and small size */
.btn-secondary { background: #6b7280; }
.btn-secondary:hover { background: #4b5563; }
.btn-danger { background: #dc2626; }
.btn-danger:hover { background: #b91c1c; }
.btn-sm { padding: 5px 12px; font-size: 13px; margin-top: 0; }

/* Navbar buttons (My Posts, New Post, Login, Register, Logout) */
.btn-newpost {
  color: #fff;
  background: transparent;
  border: 1px solid #fff;
  border-radius: 6px;
  padding: 4px 14px;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
}

.btn-newpost:hover {
  background: #fff;
  color: #212529;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{% url 'home' %}">DjangoBlog</a>
  <div class="navbar-nav me-auto">
    <a class="nav-link" href="{% url 'home' %}">Home</a>
    <a class="nav-link" href="{% url 'about' %}">About</a>
    <a class="nav-link" href="{% url 'contact' %}">Contact</a>
  </div>

  <div class="d-flex align-items-center gap-2">
    {% if request.user.is_authenticated %}
      <a href="{% url 'my_posts' %}" class="btn-newpost">My Posts</a>
      <a href="{% url 'post_create' %}" class="btn-newpost">New Post</a>
      <span class="text-white ms-2">Hi, {{ request.user.username }}</span>
      <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn-newpost">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="btn-newpost">Login</a>
      <a href="{% url 'register' %}" class="btn-newpost">Register</a>
    {% endif %}
  </div>
</nav>

{% if messages %}
<div class="container mt-3">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}

<div class="container mt-4">
  {% block content %}{% endblock %}
</div>
</body>
</html>
